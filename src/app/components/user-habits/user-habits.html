<div class="flex flex-col gap-4 p-4 
            rounded-2xl shadow-lg bg-gradient-to-br from-pink-50 via-purple-50 to-indigo-50 dark:from-gray-900 dark:via-gray-800 dark:to-gray-700 transition-colors hover:shadow-2xl">

  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100">
      Your Routine
    </h2>
    <label class="flex items-center gap-2 cursor-pointer select-none">
      <input type="checkbox"
             class="form-checkbox h-5 w-5 text-pink-500 dark:text-pink-400"
             [(ngModel)]="isRoutineActive">
      <span class="text-gray-700 dark:text-gray-200">Routine Active</span>
    </label>
  </div>

  <div class="flex flex-col gap-3 max-h-[400px] overflow-auto">
    <app-user-habit-item
      *ngFor="let habit of userHabits"
      [habit]="habit"
      [showDeleteButton]="showDeleteButton"
      (severityChange)="onSeverityChange(habit, $event)"
      (delete)="onDelete(habit)"
    ></app-user-habit-item>
  </div>

  <div class="mt-4 flex justify-end">
    <button
      (click)="saveRoutineFunc()"
      class="px-4 py-2 bg-pink-500 hover:bg-pink-600 dark:bg-pink-600 dark:hover:bg-pink-500 
             text-white rounded-lg shadow-md hover:shadow-lg transition-all
             focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-400">
      Save Routine
    </button>
  </div>
</div>
