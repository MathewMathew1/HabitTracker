<div
  class="backdrop-blur-sm bg-white/30 dark:bg-gray-900/30 border border-white/20 dark:border-gray-700/20 rounded-xl shadow-lg p-4 transition-colors"
>
  <h2 class="text-lg font-semibold text-gray-700 dark:text-gray-200 mb-4">Daily Performance</h2>
  @if(chartOptions){
  <ng-container>
    <apx-chart
      [series]="chartOptions.series"
      [chart]="chartOptions.chart"
      [xaxis]="chartOptions.xaxis"
      [stroke]="chartOptions.stroke"
      [dataLabels]="chartOptions.dataLabels"
      [grid]="chartOptions.grid"
      [yaxis]="chartOptions.yaxis"
      [title]="chartOptions.title"
    ></apx-chart>
  </ng-container>
  }
</div>
