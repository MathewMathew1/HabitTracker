<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-gray-800 p-6 rounded-xl w-96 shadow-lg modal-content">
    <h2 class="text-xl font-bold mb-4">Add Custom Habit</h2>
    <div class="mb-3">
      <input type="text" [(ngModel)]="name" placeholder="Name" class="w-full p-2 rounded border" />
      @if (nameError){
        <span class="text-red-600 text-sm mt-1 block">{{ nameError }}</span>
      }
      
    </div>

    <div class="mb-3 flex flex-col gap-1">
      <label>Emoji</label>
      <select [(ngModel)]="emoji" class="p-2 rounded border bg-white dark:bg-gray-700 text-lg">
        @for (item of habitEmojis; track item) {
        <option [value]="item">{{ item }}</option>
        }
      </select>
      @if (emojiError){
        <span class="text-red-600 text-sm">{{ emojiError }}</span>
      }
      
    </div>
    <div class="flex justify-end gap-2">
      <button
        class="px-4 py-2 bg-gray-300 text-gray-800 dark:bg-gray-600 dark:text-white rounded hover:bg-gray-400 dark:hover:bg-gray-500 transition-colors"
        (click)="close()"
      >
        Cancel
      </button>
      <button
        class="px-4 py-2 bg-pink-500 text-white rounded hover:bg-pink-600 transition-colors"
        (click)="save()"
      >
        Save
      </button>
    </div>
  </div>
</div>
