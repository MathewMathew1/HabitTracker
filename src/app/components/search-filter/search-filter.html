<div
  class="p-5 rounded-2xl shadow-lg bg-gradient-to-br from-pink-50 via-purple-50 to-indigo-50 dark:from-gray-900 dark:via-gray-800 dark:to-gray-700 transition-colors hover:shadow-2xl"
>
  <div class="relative">
    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-300"
      >🔍</span
    >
    <input
      type="text"
      [(ngModel)]="search.searchedName"
      (input)="update()"
      placeholder="Search habits..."
      class="w-full pl-10 p-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-pink-500 transition"
    />
  </div>

  <div class="mt-5 flex flex-row space-y-3">
    <div class="flex flex-col flex-1">
      <label class="flex items-center gap-3 cursor-pointer">
        <input
          type="checkbox"
          [(ngModel)]="search.includePositive"
          (change)="update()"
          class="w-5 h-5 rounded border-gray-300 dark:border-gray-600 text-green-500 focus:ring-2 focus:ring-green-400 transition"
        />
        <span class="font-medium text-gray-800 dark:text-gray-100">Positive Habits</span>
      </label>

      <label class="flex items-center gap-3 cursor-pointer">
        <input
          type="checkbox"
          [(ngModel)]="search.includeNegative"
          (change)="update()"
          class="w-5 h-5 rounded border-gray-300 dark:border-gray-600 text-red-500 focus:ring-2 focus:ring-red-400 transition"
        />
        <span class="font-medium text-gray-800 dark:text-gray-100">Negative Habits</span>
      </label>
    </div>
    <div class="">
      <button
        (click)="showModal = true"
        class="px-4 py-2 rounded bg-pink-500 text-white hover:bg-pink-600 transition"
      >
        Add Custom Habit
      </button>
    </div>
  </div>
</div>

@if(showModal){
  <app-custom-habit-modal
    (add)="addCustomHabit($event)"
    (closeModal)="showModal = false"
  ></app-custom-habit-modal>
}
