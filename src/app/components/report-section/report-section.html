<div class="p-4 space-y-8">

  <div class="backdrop-blur-sm bg-white/30 dark:bg-gray-900/30 border border-white/20 dark:border-gray-700/20 rounded-xl shadow-lg p-4 space-y-3 transition-colors">
    <h2 class="text-lg font-semibold text-gray-700 dark:text-gray-200 border-b border-gray-300 dark:border-gray-600 pb-2 mb-2">
      Pending Reports
    </h2>

    @for(report of reports; track report.date) {
      <div class="border rounded-xl shadow-md p-4 bg-white/70 dark:bg-gray-800/70 transition-colors hover:shadow-lg">
        <app-report-item [report]="report"/>
      </div>
    }@empty {
      <div class="text-center text-gray-500 dark:text-gray-400 py-6">
        No pending reports available.
      </div>
    }
  </div>

  <div class="backdrop-blur-sm bg-white/30 dark:bg-gray-900/30 border border-white/20 dark:border-gray-700/20 rounded-xl shadow-lg p-4 space-y-3 transition-colors">
    <h2 class="text-lg font-semibold text-gray-700 dark:text-gray-200 border-b border-gray-300 dark:border-gray-600 pb-2 mb-2">
      Completed Reports
    </h2>

    @for(report of filledReports; track report.date) {
      <div class="border rounded-xl shadow-md p-4 bg-white/70 dark:bg-gray-800/70 transition-colors hover:shadow-lg">
        <app-filled-report-item [report]="report"/>
      </div>
    }@empty {
      <div class="text-center text-gray-500 dark:text-gray-400 py-6">
        No completed reports available.
      </div>
    }
  </div>

</div>
